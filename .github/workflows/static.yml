name: Deploy SoundLink Safari PWA

on:
  push:
    branches:
      - feature/soundlink-safari-pwa
    paths:
      - 'web/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: soundlink-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy SoundLink PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate website
        run: |
          set -e
          test -s web/index.html
          test -s web/manifest.webmanifest
          test -s web/sw.js
          test -s web/icon.svg
          node -e "const m=JSON.parse(require('fs').readFileSync('web/manifest.webmanifest','utf8')); if(!m.name || !m.start_url || !m.scope || !m.icons?.length) throw new Error('Manifest non valido');"
          grep -q 'serviceWorker.register' web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
