name: Deploy SoundLink to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: soundlink-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy SoundLink PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate app
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/manifest.webmanifest
          test -s web/sw.js
          test -s web/icon.svg
          node -e "const m=JSON.parse(require('fs').readFileSync('web/manifest.webmanifest','utf8')); if(!m.name || !m.start_url || !m.scope || !Array.isArray(m.icons) || !m.icons.length) process.exit(1);"
          grep -q 'serviceWorker.register' web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
