name: Deploy SoundLink Safari PWA

on:
  push:
    branches:
      - feature/soundlink-safari-pwa
    paths:
      - 'web/**'
      - '.github/workflows/deploy-soundlink-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy SoundLink PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA files
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/manifest.webmanifest
          test -s web/sw.js
          test -s web/icon.svg
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('web/manifest.webmanifest','utf8')); if(!m.name || !m.start_url || !m.scope || !Array.isArray(m.icons) || !m.icons.length) process.exit(1); console.log('Manifest PWA valido:', m.name);"
          grep -q "serviceWorker.register" web/index.html
          echo "File PWA presenti e controlli superati."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
